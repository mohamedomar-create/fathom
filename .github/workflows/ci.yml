name: CI
on:
  push:
  pull_request:
# Read the code, nothing more: no job writes to the repository or its packages.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails on a known high or critical advisory in what the site runs (dev tools are left out).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Browser tests (public pages and signed-in flows) and database tests, against a local Supabase
  # (Postgres + GoTrue + PostgREST, see scripts/local-supabase). Never touches the real project.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Postgres binaries
        run: ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y postgresql)
      - uses: actions/cache@v6
        with:
          path: .local-supabase/bin
          key: local-supabase-${{ hashFiles('scripts/local-supabase/start.sh') }}
      - name: Start local Supabase
        run: scripts/local-supabase/start.sh
      - name: Database tests
        run: DB_URL=postgres://postgres@127.0.0.1:54322/postgres sh scripts/test-db.sh
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build against the local Supabase
        run: |
          set -a; . .local-supabase/env; set +a
          ENCRYPTION_KEY=$(openssl rand -base64 32) npm run build
      - name: Browser tests
        run: |
          set -a; . .local-supabase/env; set +a
          export CHROMIUM_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")
          E2E_AUTH=1 npx playwright test
      - name: Service logs
        if: failure()
        run: tail -n 60 .local-supabase/logs/*.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
